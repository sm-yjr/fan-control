[package]
name = "fan-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "FanControl"
path = "src/main.rs"

[dependencies]
fan-core = { path = "../fan-core" }
fan-platform = { path = "../fan-platform" }
gpui = { package = "gpui-pre", version = "=0.3.14", default-features = false, features = ["font-kit"] }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.14", default-features = false, features = ["font-kit", "runtime_shaders"] }
gpui-component = { version = "0.11.0", default-features = false }
gpui-kit-assets = "0.11.0"
raw-window-handle = "0.6"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
block2 = "0.6"
