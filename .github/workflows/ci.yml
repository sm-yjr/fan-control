name: CI

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build Swift package
        run: swift build

      - name: Verify FanUI foundation and components
        run: ./script/test_fan_ui.sh

      - name: Verify thermal model
        run: ./script/test_thermal_model.sh

      - name: Verify status item presentation
        run: ./script/test_status_item_presentation.sh

      - name: Verify app launch mode
        run: ./script/test_app_launch_mode.sh

      - name: Verify packaged Sparkle runtime
        run: ./script/test_update_runtime.sh

      - name: Package Apple Silicon app
        env:
          ARCHITECTURES: arm64
          BUILD_CONFIGURATION: release
          OUTPUT_DIR: ${{ github.workspace }}/dist
        run: ./script/package_app.sh

      - name: Verify app bundle
        run: |
          set -euo pipefail
          APP="dist/FanControl.app"
          HELPER="$APP/Contents/Library/LaunchServices/com.local.fan-control.helper"
          plutil -lint "$APP/Contents/Info.plist"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --verify --strict --verbose=2 "$HELPER"
          test -x "$APP/Contents/MacOS/FanControl"
          test -x "$HELPER"
          test -d "$APP/Contents/Frameworks/Sparkle.framework"
          test -f "$APP/Contents/Resources/FanControl-LICENSE.txt"
          test -f "$APP/Contents/Resources/Sparkle-LICENSE.txt"
          test -x script/sign_app.sh
          test -x script/package_dmg.sh
          bash -n script/package_dmg.sh

          if otool -L "$HELPER" | grep -q "Sparkle.framework"; then
            echo "The privileged helper executable must not link Sparkle.framework." >&2
            exit 1
          fi

      - name: Verify DMG packaging
        run: |
          set -euo pipefail
          ./script/package_dmg.sh \
            dist/FanControl.app \
            dist/FanControl-ci.dmg \
            "Fan Control CI"
          hdiutil verify dist/FanControl-ci.dmg
