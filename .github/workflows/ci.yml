name: CI

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 30
    strategy:
      matrix:
        runner: [macos-14, macos-15]
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Prepare Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable

      - name: Check Rust formatting, lints and tests
        run: ./script/test_rust.sh

      - name: Verify Widget snapshot contract
        run: ./script/test_widget.sh

      - name: Verify measured Widget layouts
        run: ./script/render_widget_layouts.sh "$RUNNER_TEMP/fan-control-widget-layouts"

      - name: Build Rust app
        run: cargo build --locked --package fan-app --bin FanControl

      - name: Verify packaged Sparkle runtime
        run: ./script/test_update_runtime.sh

      - name: Package Apple Silicon app
        env:
          ARCHITECTURES: arm64
          BUILD_CONFIGURATION: release
          OUTPUT_DIR: ${{ github.workspace }}/dist
        run: ./script/package_app.sh

      - name: Verify app bundle
        run: |
          set -euo pipefail
          APP="dist/FanControl.app"
          HELPER="$APP/Contents/Library/LaunchServices/com.local.fan-control.helper"
          plutil -lint "$APP/Contents/Info.plist"
          python3 script/verify_widget_bundle.py "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --verify --strict --verbose=2 "$HELPER"
          test -x "$APP/Contents/MacOS/FanControl"
          test -x "$HELPER"
          test -d "$APP/Contents/Frameworks/Sparkle.framework"
          test -f "$APP/Contents/Resources/FanControl.icns"
          test -f "$APP/Contents/Resources/FanControl-LICENSE.txt"
          test -f "$APP/Contents/Resources/Sparkle-LICENSE.txt"
          test -x script/sign_app.sh
          test -x script/package_dmg.sh
          bash -n script/package_dmg.sh

          if [[ "$(plutil -extract CFBundleIconFile raw "$APP/Contents/Info.plist")" != "FanControl.icns" ]]; then
            echo "The packaged app must reference FanControl.icns." >&2
            exit 1
          fi

          if otool -L "$HELPER" | grep -Eq 'Sparkle\.framework|@rpath/|@executable_path/|@loader_path/'; then
            echo "The privileged helper must not depend on app-bundled dynamic libraries." >&2
            exit 1
          fi

      - name: Initialize native windows in isolated demo mode
        timeout-minutes: 2
        run: |
          set -euo pipefail
          APP_BINARY="dist/FanControl.app/Contents/MacOS/FanControl"
          FAN_CONTROL_DEMO_LANGUAGE=zh-Hans "$APP_BINARY" --ui-smoke
          FAN_CONTROL_DEMO_LANGUAGE=en "$APP_BINARY" --ui-smoke
          FAN_CONTROL_RENDER_DIR="$RUNNER_TEMP/fan-control-dashboard-render" "$APP_BINARY" --dashboard-render

      - name: Verify DMG packaging
        run: |
          set -euo pipefail
          ./script/package_dmg.sh \
            dist/FanControl.app \
            dist/FanControl-ci.dmg \
            "Fan Control CI"
          hdiutil verify dist/FanControl-ci.dmg

  msrv:
    name: Rust 1.85.1 minimum toolchain
    runs-on: macos-14
    timeout-minutes: 20
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Prepare minimum Rust toolchain
        run: rustup toolchain install 1.85.1 --profile minimal

      - name: Test workspace with minimum Rust toolchain
        run: cargo +1.85.1 test --locked --workspace
